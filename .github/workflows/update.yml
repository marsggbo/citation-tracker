name: Daily Citation Update

on:
  schedule:
    # 每天 UTC 22:00 = 新加坡时间 06:00，留有充足缓冲保证 8-9 点前完成
    - cron: '0 22 * * *'
  workflow_dispatch:

concurrency:
  group: citation-update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python scrape.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 保存 scraper 的最新数据
          cp citations.json /tmp/citations_scraped.json
          # 同步到最新 origin，彻底避免 rebase/merge 冲突
          git fetch origin main
          git reset --hard origin/main
          # 将 scraper 数据覆盖回来
          cp /tmp/citations_scraped.json citations.json
          git add citations.json
          git diff --staged --quiet && echo "No changes, skipping." && exit 0
          git commit -m "Update citations $(TZ='Asia/Shanghai' date +'%Y-%m-%d')"
          git push origin main

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
