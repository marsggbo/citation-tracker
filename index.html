<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Citation Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#333;padding:2rem}
@media(prefers-color-scheme:dark){body{background:#1a1a2e;color:#eee}}
.container{max-width:900px;margin:0 auto}
h1{text-align:center;margin-bottom:2rem;color:#333}
@media(prefers-color-scheme:dark){h1{color:#fff}}

/* 新增：顶部统计卡片 */
.stats-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}
.stat-card{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border-radius:16px;padding:1.5rem;color:#fff;box-shadow:0 4px 15px rgba(102,126,234,0.4);text-align:center}
.stat-card.total{background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%);box-shadow:0 4px 15px rgba(240,147,251,0.4)}
.stat-card.today{background:linear-gradient(135deg,#4facfe 0%,#00f2fe 100%);box-shadow:0 4px 15px rgba(79,172,254,0.4)}
.stat-label{font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;opacity:0.9;margin-bottom:0.5rem}
.stat-value{font-size:2.5rem;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,0.2)}
.stat-change{font-size:0.85rem;margin-top:0.3rem;opacity:0.95}
.stat-change.up{color:#90ee90}
.stat-change.down{color:#ffb6c1}

/* 新增：总体趋势图 */
.trend-section{background:#fff;border-radius:16px;padding:1.5rem;margin-bottom:2rem;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
@media(prefers-color-scheme:dark){.trend-section{background:#1e293b}}
.trend-title{font-size:1.1rem;font-weight:600;margin-bottom:1rem;color:#333}
@media(prefers-color-scheme:dark){.trend-title{color:#fff}}
.trend-chart{height:200px}

.paper{background:#fff;margin-bottom:10px;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
@media(prefers-color-scheme:dark){.paper{background:#1e293b}}
.paper-head{padding:1rem 1.5rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.paper-head:hover{background:#f8f9fa}
@media(prefers-color-scheme:dark){.paper-head:hover{background:#273449}}
.paper-title{font-weight:600;font-size:1rem;flex:1;line-height:1.4}
.paper-meta{font-size:0.85rem;color:#666;margin-top:4px}
@media(prefers-color-scheme:dark){.paper-meta{color:#94a3b8}}
.paper-cites{font-weight:bold;color:#3b82f6;font-size:1.1rem;padding:0.5rem 1rem;background:#f0f7ff;border-radius:20px}
@media(prefers-color-scheme:dark){.paper-cites{background:#1e3a5f;color:#60a5fa}}
.arrow{color:#999;font-size:0.8rem;transition:transform 0.2s}
.paper.open .arrow{transform:rotate(180deg)}

.paper-chart{max-height:0;overflow:hidden;transition:max-height 0.3s ease}
.paper.open .paper-chart{max-height:300px}
.chart-container{background:#fafafa;padding:1rem;height:250px}
@media(prefers-color-scheme:dark){.chart-container{background:#0f172a}}

.loading{text-align:center;padding:3rem;color:#666}
.error{text-align:center;padding:3rem;color:red}
</style>
</head>
<body>
<div class="container">
  <h1>📊 Citation Tracker</h1>
  
  <!-- 新增：总览统计 -->
  <div class="stats-container">
    <div class="stat-card total">
      <div class="stat-label">Total Citations</div>
      <div class="stat-value" id="totalCites">-</div>
      <div class="stat-change" id="totalChange"></div>
    </div>
    <div class="stat-card today">
      <div class="stat-label">Total Citations</div>
      <div class="stat-value" id="todayCites">-</div>
      <div class="stat-change" id="todayChange"></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Papers Tracked</div>
      <div class="stat-value" id="paperCount">-</div>
    </div>
  </div>
  
  <!-- 新增：总体趋势 -->
  <div class="trend-section">
    <div class="trend-title">📈 Total Citations Trend (Last 30 Days)</div>
    <div class="trend-chart"><canvas id="overallTrend"></canvas></div>
  </div>
  
  <div id="list"><div class="loading">Loading...</div></div>
</div>

<script>
var CSV_URL = 'citations.csv';
var charts = {};
var papersData = [];
var overallChart = null;

function parseCSV(csv) {
  var lines = csv.trim().split('\n');
  var result = [];
  for (var i = 1; i < lines.length; i++) {
    var vals = [], inQuotes = false, cur = '';
    for (var j = 0; j < lines[i].length; j++) {
      var ch = lines[i][j];
      if (ch === '"') { inQuotes = !inQuotes; }
      else if (ch === ',' && !inQuotes) { vals.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    vals.push(cur.trim());
    if (vals[0]) result.push({date: vals[0], title: vals[1] || '', citations: parseInt(vals[2]) || 0, year: vals[3] || ''});
  }
  return result;
}

fetch(CSV_URL).then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
  .then(function(csv) {
    var data = parseCSV(csv);
    
    // 按论文分组
    var papers = {};
    data.forEach(function(d) {
      if (!papers[d.title]) papers[d.title] = {title: d.title, year: d.year, history: []};
      papers[d.title].history.push({date: d.date, citations: d.citations});
    });
    papersData = Object.values(papers);
    
    // 获取最新引用数
    var latest = {};
    data.forEach(function(d) { latest[d.title] = d.citations; });
    
    // 按引用数排序
    papersData.sort(function(a, b) { return (latest[b.title] || 0) - (latest[a.title] || 0); });
    
    // 计算总览统计
    var dates = [...new Set(data.map(d => d.date))].sort();
    var dailyTotals = dates.map(date => data.filter(d => d.date === date).reduce((sum, d) => sum + d.citations, 0));
    var dailyNew = dailyTotals.map((total, i) => i === 0 ? 0 : Math.max(0, total - dailyTotals[i-1]));
    
    var totalCites = dailyTotals[dailyTotals.length - 1];
    var prevTotal = dailyTotals[dailyTotals.length - 2] || totalCites;
    var todayNew = dailyNew[dailyNew.length - 1];
    var yesterdayNew = dailyNew[dailyNew.length - 2] || 0;
    
    document.getElementById('totalCites').textContent = totalCites.toLocaleString();
    document.getElementById('todayCites').textContent = todayNew.toLocaleString();
    document.getElementById('paperCount').textContent = papersData.length;
    
    var totalDiff = totalCites - prevTotal;
    var totalChangeEl = document.getElementById('totalChange');
    totalChangeEl.innerHTML = (totalDiff >= 0 ? '+' : '') + totalDiff + ' vs yesterday';
    totalChangeEl.className = 'stat-change ' + (totalDiff >= 0 ? 'up' : 'down');
    
    var todayDiff = todayNew - yesterdayNew;
    var todayChangeEl = document.getElementById('todayChange');
    todayChangeEl.innerHTML = (todayDiff >= 0 ? '+' : '') + todayDiff + ' vs yesterday';
    todayChangeEl.className = 'stat-change ' + (todayDiff >= 0 ? 'up' : 'down');
    
    // 渲染总体趋势图
    var ctx = document.getElementById('overallTrend').getContext('2d');
    overallChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: dates.slice(-30).map(d => d.slice(5)),
        datasets: [{
          data: dailyTotals.slice(-30),
          borderColor: '#667eea',
          backgroundColor: 'rgba(102, 126, 234, 0.1)',
          fill: true,
          tension: 0.3,
          pointRadius: 3,
          pointHoverRadius: 5
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { maxTicksLimit: 10 } },
          y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } }
        }
      }
    });
    
    // 渲染论文列表
    var html = '';
    papersData.forEach(function(p, i) {
      var cites = latest[p.title] || 0;
      html += '<div class="paper" id="paper-' + i + '">' +
        '<div class="paper-head" onclick="toggle(' + i + ')">' +
          '<div><div class="paper-title">' + p.title + '</div>' +
          '<div class="paper-meta">' + (p.year || '') + '</div></div>' +
          '<div class="paper-cites">' + cites + '</div>' +
          '<div class="arrow">▼</div>' +
        '</div>' +
        '<div class="paper-chart"><div class="chart-container"><canvas id="chart-' + i + '"></canvas></div></div>' +
      '</div>';
    });
    document.getElementById('list').innerHTML = html;
  })
  .catch(function(e) { document.getElementById('list').innerHTML = '<div class="error">❌ Error: ' + e.message + '</div>'; });

function toggle(i) {
  var paper = document.getElementById('paper-' + i);
  var isOpen = paper.classList.contains('open');
  document.querySelectorAll('.paper').forEach(function(el) { el.classList.remove('open'); });
  
  if (!isOpen) {
    paper.classList.add('open');
    if (!charts[i]) {
      var p = papersData[i];
      p.history.sort(function(a, b) { return a.date.localeCompare(b.date); });
      
      charts[i] = new Chart(document.getElementById('chart-' + i), {
        type: 'line',
        data: {
          labels: p.history.map(function(h) { return h.date.slice(5); }),
          datasets: [{
            data: p.history.map(function(h) { return h.citations; }),
            borderColor: '#3b82f6',
            backgroundColor: 'rgba(59, 130, 246, 0.1)',
            fill: true,
            tension: 0.3,
            pointRadius: 4,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false } },
            y: { beginAtZero: false }
          }
        }
      });
    }
  }
}
</script>
</body>
</html>
