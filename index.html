<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Citation Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f5f6f8;--surface:#ffffff;--surface2:#f7f9fc;
  --text:#0f172a;--text2:#64748b;--text3:#94a3b8;--border:#e6e9ef;
  --accent:#6366f1;--accent2:#818cf8;--accentSoft:rgba(99,102,241,.10);
  --green:#10b981;--red:#ef4444;--amber:#f59e0b;
  --r:14px;
  --sh:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
  --shm:0 2px 8px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.05);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0a0f1e;--surface:#111a2e;--surface2:#0d1526;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;--border:#243149;
  --accent:#818cf8;--accent2:#a5b4fc;--accentSoft:rgba(129,140,248,.14);
  --sh:0 1px 3px rgba(0,0,0,.4);--shm:0 4px 20px rgba(0,0,0,.45);
}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:1.25rem;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.container{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:1.1rem}

/* ── Header ── */
.header{position:relative;overflow:hidden;background:linear-gradient(135deg,#6366f1 0%,#7c73f0 45%,#8b5cf6 100%);border-radius:18px;padding:2.1rem 2rem 1.7rem;color:#fff;box-shadow:0 12px 34px rgba(99,102,241,.32)}
.header::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% -10%,rgba(255,255,255,.25),transparent 42%),radial-gradient(circle at 12% 120%,rgba(255,255,255,.14),transparent 46%);pointer-events:none}
.header h1{font-size:1.85rem;font-weight:800;letter-spacing:-.6px;display:flex;align-items:center;gap:.55rem;position:relative}
.header p{margin-top:.5rem;opacity:.9;font-size:.85rem;position:relative}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 2s infinite;margin-right:.35rem}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}

/* ── Stat Cards ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.9rem}
.stat-card{background:var(--surface);border-radius:var(--r);padding:1.15rem 1.2rem;box-shadow:var(--sh);border:1px solid var(--border);display:flex;flex-direction:column;gap:.15rem;transition:transform .18s,box-shadow .18s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shm)}
.stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.35rem}
.stat-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);font-weight:600}
.stat-ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:.85rem}
.ico-total{background:rgba(99,102,241,.14)}
.ico-today{background:rgba(16,185,129,.14)}
.ico-count{background:rgba(245,158,11,.14)}
.ico-avg{background:rgba(236,72,153,.14)}
.stat-value{font-size:1.85rem;font-weight:800;line-height:1.05;color:var(--text);letter-spacing:-.5px}
.stat-change{font-size:.74rem;margin-top:.3rem;color:var(--text2);font-weight:500}
.stat-change.up{color:var(--green)}.stat-change.down{color:var(--red)}

/* ── Section ── */
.section{background:var(--surface);border-radius:var(--r);padding:1.4rem 1.5rem;box-shadow:var(--sh);border:1px solid var(--border)}
.section-title{font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:1rem;display:flex;align-items:center;gap:.45rem}
.chart-wrap{height:230px}

/* ── Controls ── */
.controls{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.search-box{flex:1;min-width:180px;padding:.5rem .8rem;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--text);font-size:.85rem;outline:none;transition:border-color .2s,box-shadow .2s}
.search-box:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
.sort-btn{padding:.42rem .8rem;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--text2);font-size:.78rem;cursor:pointer;transition:all .18s;white-space:nowrap;font-weight:600}
.sort-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sort-btn:hover:not(.active){border-color:var(--accent);color:var(--accent)}
.sort-label{font-size:.75rem;color:var(--text3);margin-right:-.1rem}

/* ── Paper List ── */
.paper{border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:.6rem;transition:box-shadow .2s,border-color .2s}
.paper:hover{box-shadow:var(--sh);border-color:var(--accent2)}
.paper:last-child{margin-bottom:0}
.paper-head{padding:.75rem .95rem;cursor:pointer;display:flex;align-items:center;gap:.6rem;background:var(--surface2);transition:background .15s}
.paper-head:hover{background:var(--accentSoft)}
.rank{font-size:.8rem;font-weight:700;color:var(--text3);width:1.5rem;text-align:center;flex-shrink:0}
.rank.medal{font-size:1.05rem}
.paper-info{flex:1;min-width:0}
.paper-title{font-weight:600;font-size:.88rem;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);display:flex;align-items:center;gap:.4rem}
.paper-meta{font-size:.72rem;color:var(--text2);margin-top:2px;display:flex;gap:.7rem;flex-wrap:wrap}
.tag-new{font-size:.6rem;font-weight:800;letter-spacing:.04em;padding:.1rem .38rem;border-radius:5px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;flex-shrink:0;text-transform:uppercase}
.paper-stats{display:flex;align-items:center;gap:.45rem;flex-shrink:0}
.cites-num{font-weight:800;color:var(--accent);font-size:1.05rem;min-width:2.6rem;text-align:right}
.badge{font-size:.68rem;padding:.13rem .42rem;border-radius:999px;font-weight:700;min-width:2.3rem;text-align:center}
.badge.up{background:rgba(16,185,129,.15);color:var(--green)}
.badge.down{background:rgba(239,68,68,.12);color:var(--red)}
.badge.flat{background:var(--border);color:var(--text2)}
.arrow{color:var(--text3);font-size:.65rem;transition:transform .25s;flex-shrink:0}
.paper.open .arrow{transform:rotate(180deg)}

/* ── Paper Chart ── */
.paper-chart{max-height:0;overflow:hidden;transition:max-height .35s ease}
.paper.open .paper-chart{max-height:320px}
.paper-chart-inner{padding:.85rem 1rem;height:270px;background:var(--surface);border-top:1px solid var(--border)}

/* ── Milestones ── */
.milestones{display:flex;flex-direction:column;gap:.5rem}
.ms-item{display:flex;align-items:center;gap:.7rem;padding:.6rem .8rem;border-radius:10px;background:var(--surface2);border:1px solid var(--border)}
.ms-badge{font-size:.72rem;font-weight:800;padding:.22rem .55rem;border-radius:8px;color:#fff;background:linear-gradient(135deg,#f59e0b,#f97316);flex-shrink:0;white-space:nowrap}
.ms-title{flex:1;min-width:0;font-size:.83rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-date{font-size:.72rem;color:var(--text3);flex-shrink:0}

/* ── Footer ── */
.footer{text-align:center;padding:.6rem;color:var(--text3);font-size:.75rem;line-height:1.7}

/* ── Loading / Error ── */
.loading{text-align:center;padding:3rem;color:var(--text2);font-size:1rem}
.error-msg{text-align:center;padding:3rem;color:var(--red);font-size:.95rem}

@media(max-width:560px){
  body{padding:.8rem}
  .header{padding:1.6rem 1.3rem 1.3rem}
  .header h1{font-size:1.5rem}
  .stat-value{font-size:1.55rem}
  .paper-meta span.hide-sm{display:none}
}
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <h1>📊 Citation Tracker</h1>
    <p id="lastUpdated"><span class="pulse"></span>Loading…</p>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-top"><span class="stat-label">Total Citations</span><span class="stat-ico ico-total">📚</span></div>
      <div class="stat-value" id="totalCites">—</div>
      <div class="stat-change" id="totalChange"></div>
    </div>
    <div class="stat-card">
      <div class="stat-top"><span class="stat-label">Today's New</span><span class="stat-ico ico-today">🔥</span></div>
      <div class="stat-value" id="todayCites">—</div>
      <div class="stat-change" id="todayChange"></div>
    </div>
    <div class="stat-card">
      <div class="stat-top"><span class="stat-label">Papers Tracked</span><span class="stat-ico ico-count">📄</span></div>
      <div class="stat-value" id="paperCount">—</div>
      <div class="stat-change" id="daysTracked"></div>
    </div>
    <div class="stat-card">
      <div class="stat-top"><span class="stat-label">7-Day Avg Growth</span><span class="stat-ico ico-avg">📈</span></div>
      <div class="stat-value" id="avgGrowth">—</div>
      <div class="stat-change" id="avgAll"></div>
    </div>
  </div>

  <!-- Overall trend -->
  <div class="section">
    <div class="section-title">📈 Total Citations — All-Time Trend</div>
    <div class="chart-wrap"><canvas id="overallChart"></canvas></div>
  </div>

  <!-- Milestones -->
  <div class="section" id="milestonesSec" style="display:none">
    <div class="section-title">🎉 Recent Milestones</div>
    <div id="milestones" class="milestones"></div>
  </div>

  <!-- Paper list -->
  <div class="section" id="papersSec">
    <div class="section-title">📄 Papers</div>
    <div class="controls">
      <input class="search-box" id="searchInput" type="text" placeholder="🔍 Search papers…" oninput="renderList()">
      <span class="sort-label">Sort:</span>
      <button class="sort-btn active" id="btn-cites" onclick="setSort('cites')">Citations</button>
      <button class="sort-btn" id="btn-growth" onclick="setSort('growth')">Growth</button>
      <button class="sort-btn" id="btn-year" onclick="setSort('year')">Year</button>
      <button class="sort-btn" id="btn-new" onclick="setSort('new')">Newest</button>
    </div>
    <div id="list"><div class="loading">⏳ Loading data…</div></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    Data sourced from Google Scholar · Auto-updated daily via GitHub Actions
    &nbsp;·&nbsp;
    <a href="citations.json">⬇ Download JSON</a>
  </div>

</div>
<script>
var DATA_URL = 'citations.json';
var NEW_WINDOW_DAYS = 14;   /* a paper is flagged NEW if first seen within this many days */

/* state */
var papersData = [];      /* [{title,year,history:[{date,cites}],firstSeen,isNew}] */
var latestCites = {};     /* title -> latest citation count */
var prevCites   = {};     /* title -> previous day count */
var allDates    = [];     /* sorted date strings */
var dailyTotals = [];     /* total citations per date (aligned with allDates) */
var charts      = {};     /* globalIdx -> Chart instance */
var currentSort = 'cites';
var maxDate     = '';

/* ── helpers ── */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function isDark(){return window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
function fmt(n){return (n>=0?'+':'')+n}

function chartColors(){
  var d=isDark();
  return {grid:d?'rgba(255,255,255,.055)':'rgba(15,23,42,.05)', tick:d?'#8ea0b8':'#94a3b8'};
}

/* Global Chart.js theming */
Chart.defaults.font.family='-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
Chart.defaults.font.size=11;

/* Shared tooltip styling + rich content for citation trend charts.
   `dates` is the aligned date array; each point shows date, citations and daily-new (delta). */
function trendTooltip(dates){
  return {
    enabled:true,
    backgroundColor:isDark()?'rgba(17,26,46,.96)':'rgba(255,255,255,.98)',
    titleColor:isDark()?'#f1f5f9':'#0f172a',
    bodyColor:isDark()?'#cbd5e1':'#334155',
    borderColor:isDark()?'rgba(129,140,248,.4)':'rgba(99,102,241,.25)',
    borderWidth:1,
    padding:11,
    cornerRadius:9,
    displayColors:false,
    titleFont:{weight:'700',size:12},
    bodyFont:{size:12},
    bodySpacing:5,
    caretSize:6,
    callbacks:{
      title:function(items){return '📅 '+dates[items[0].dataIndex]},
      label:function(ctx){
        var i=ctx.dataIndex, v=ctx.parsed.y;
        var lines=['引用总数 / Citations:  '+v.toLocaleString()];
        if(i>0){
          var delta=v-ctx.dataset.data[i-1];
          lines.push('当日新增 / New:  '+fmt(delta)+(delta>0?' 📈':delta<0?' 📉':' —'));
        }else{
          lines.push('当日新增 / New:  — (first day)');
        }
        return lines;
      }
    }
  };
}

/* ── sort / filter ── */
function setSort(type){
  currentSort=type;
  document.querySelectorAll('.sort-btn').forEach(function(b){b.classList.remove('active')});
  document.getElementById('btn-'+type).classList.add('active');
  renderList();
}

function getSorted(){
  var q=(document.getElementById('searchInput').value||'').toLowerCase();
  var list=papersData.filter(function(p){return !q||p.title.toLowerCase().includes(q)});
  if(currentSort==='cites')
    list.sort(function(a,b){return (latestCites[b.title]||0)-(latestCites[a.title]||0)});
  else if(currentSort==='growth')
    list.sort(function(a,b){
      return ((latestCites[b.title]||0)-(prevCites[b.title]||0))-((latestCites[a.title]||0)-(prevCites[a.title]||0))
    });
  else if(currentSort==='new')
    list.sort(function(a,b){return (a.firstSeen<b.firstSeen?1:a.firstSeen>b.firstSeen?-1:0)||((latestCites[b.title]||0)-(latestCites[a.title]||0))});
  else
    list.sort(function(a,b){return (parseInt(b.year)||0)-(parseInt(a.year)||0)});
  return list;
}

/* ── recent milestones ── */
var MS_STEP=50;          /* flag every time a paper crosses a multiple of this */
var MS_WINDOW_DAYS=60;   /* only show crossings within this many days */
function renderMilestones(){
  var events=[];
  papersData.forEach(function(p){
    var h=p.history;
    for(var i=1;i<h.length;i++){
      var lo=Math.floor(h[i-1].cites/MS_STEP), hi=Math.floor(h[i].cites/MS_STEP);
      for(var m=lo+1;m<=hi;m++) events.push({date:h[i].date,title:p.title,T:m*MS_STEP});
    }
  });
  /* keep only recent crossings, newest first */
  events=events.filter(function(e){return maxDate && daysBetween(e.date,maxDate)<=MS_WINDOW_DAYS});
  events.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.T-a.T});
  events=events.slice(0,8);
  if(!events.length) return;
  var html=events.map(function(e){
    return '<div class="ms-item">'
      +'<span class="ms-badge">'+e.T.toLocaleString()+'+ 🎯</span>'
      +'<span class="ms-title" title="'+esc(e.title)+'">'+esc(e.title)+'</span>'
      +'<span class="ms-date">'+e.date+'</span>'
      +'</div>';
  }).join('');
  document.getElementById('milestones').innerHTML=html;
  document.getElementById('milestonesSec').style.display='';
}

/* ── render paper list ── */
function renderList(){
  var papers=getSorted();
  if(!papers.length){
    document.getElementById('list').innerHTML='<div class="loading">No papers found.</div>';
    return;
  }
  var medals=['🥇','🥈','🥉'];
  var rankByCites=(currentSort==='cites');
  var html='';
  papers.forEach(function(p,idx){
    var gi=papersData.indexOf(p);
    var c=latestCites[p.title]||0;
    var prev=prevCites[p.title]||0;
    var diff=c-prev;
    var cls=diff>0?'up':diff<0?'down':'flat';
    var txt=diff>0?'+'+diff:diff<0?String(diff):'—';
    var rankHtml=(rankByCites&&idx<3)
      ?'<span class="rank medal">'+medals[idx]+'</span>'
      :'<span class="rank">'+(idx+1)+'</span>';
    var newTag=p.isNew?'<span class="tag-new">new</span>':'';
    var totalGain=p.history.length>1?(c-p.history[0].cites):0;
    html+='<div class="paper" id="paper-'+gi+'">'
      +'<div class="paper-head" onclick="toggle('+gi+')">'
      +rankHtml
      +'<div class="paper-info">'
        +'<div class="paper-title" title="'+esc(p.title)+'">'+newTag+'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.title)+'</span></div>'
        +'<div class="paper-meta">'
          +(p.year?'<span>📅 '+esc(p.year)+'</span>':'')
          +'<span class="hide-sm">📊 '+p.history.length+' days tracked</span>'
          +(totalGain>0?'<span class="hide-sm">↗ +'+totalGain+' since tracked</span>':'')
        +'</div>'
      +'</div>'
      +'<div class="paper-stats">'
        +'<span class="cites-num">'+c.toLocaleString()+'</span>'
        +'<span class="badge '+cls+'">'+txt+'</span>'
      +'</div>'
      +'<span class="arrow">▼</span>'
      +'</div>'
      +'<div class="paper-chart"><div class="paper-chart-inner"><canvas id="chart-'+gi+'"></canvas></div></div>'
      +'</div>';
  });
  document.getElementById('list').innerHTML=html;
}

/* ── expand / collapse ── */
function toggle(gi){
  var el=document.getElementById('paper-'+gi);
  if(!el) return;
  var wasOpen=el.classList.contains('open');
  document.querySelectorAll('.paper.open').forEach(function(x){x.classList.remove('open')});
  if(wasOpen) return;
  el.classList.add('open');
  if(!charts[gi]){
    var p=papersData[gi];
    var col=chartColors();
    var dates=p.history.map(function(h){return h.date});
    var ctx=document.getElementById('chart-'+gi).getContext('2d');
    var grad=ctx.createLinearGradient(0,0,0,260);
    grad.addColorStop(0,'rgba(99,102,241,.22)');
    grad.addColorStop(1,'rgba(99,102,241,0)');
    charts[gi]=new Chart(ctx,{
      type:'line',
      data:{
        labels:p.history.map(function(h){return h.date.slice(5)}),
        datasets:[{
          data:p.history.map(function(h){return h.cites}),
          borderColor:'#6366f1',backgroundColor:grad,
          fill:true,tension:.35,borderWidth:2,
          pointRadius:p.history.length>45?0:2.5,pointHoverRadius:6,
          pointBackgroundColor:'#6366f1',pointBorderColor:'#fff',pointBorderWidth:1.5
        }]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        interaction:{mode:'index',intersect:false},
        plugins:{legend:{display:false},tooltip:trendTooltip(dates)},
        scales:{
          x:{grid:{display:false},ticks:{color:col.tick,maxTicksLimit:9}},
          y:{grid:{color:col.grid},ticks:{color:col.tick}}
        }
      }
    });
  }
}

/* ── main data load ── */
fetch(DATA_URL).then(function(r){
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}).then(function(json){

  /* parse JSON into papersData */
  papersData=[];
  Object.keys(json).forEach(function(title){
    var entry=json[title];
    var histObj=entry.history||{};
    var dates=Object.keys(histObj).sort();
    var hist=dates.map(function(d){return {date:d,cites:histObj[d]}});
    papersData.push({
      title:title,
      year:entry.year||'',
      history:hist,
      firstSeen:entry.first_seen||(dates.length?dates[0]:'')
    });
  });

  /* collect all unique dates */
  var dateSet={};
  papersData.forEach(function(p){p.history.forEach(function(h){dateSet[h.date]=1})});
  allDates=Object.keys(dateSet).sort();
  maxDate=allDates[allDates.length-1]||'';

  /* latest & previous citation counts per paper + NEW flag */
  var newCount=0;
  papersData.forEach(function(p){
    var h=p.history;
    latestCites[p.title]=h.length?h[h.length-1].cites:0;
    prevCites[p.title]=h.length>1?h[h.length-2].cites:latestCites[p.title];
    p.isNew = p.firstSeen && maxDate && daysBetween(p.firstSeen,maxDate)<=NEW_WINDOW_DAYS && p.firstSeen!==allDates[0];
    if(p.isNew) newCount++;
  });

  /* daily totals: for each date, sum every paper's latest-known count up to that date */
  var pacc={};
  dailyTotals=allDates.map(function(date){
    var sum=0;
    papersData.forEach(function(p,i){
      var h=p.history, lo=pacc[i]||0;
      for(var k=lo;k<h.length;k++){ if(h[k].date<=date){pacc[i]=k;} else break; }
      if(h.length&&h[0].date<=date) sum+=h[pacc[i]].cites;
    });
    return sum;
  });

  /* ── stat cards ── */
  var total=dailyTotals[dailyTotals.length-1]||0;
  var prevTotal=dailyTotals.length>1?dailyTotals[dailyTotals.length-2]:total;
  var todayNew=total-prevTotal;
  var twoDaysTotal=dailyTotals.length>2?dailyTotals[dailyTotals.length-3]:prevTotal;
  var yestNew=prevTotal-twoDaysTotal;

  /* 7-day avg growth (uses all deltas incl. corrections) */
  var deltas=[];
  for(var i=1;i<dailyTotals.length;i++)deltas.push(dailyTotals[i]-dailyTotals[i-1]);
  var last7=deltas.slice(-7);
  var avg7=last7.length?last7.reduce(function(a,v){return a+v},0)/last7.length:0;
  var avgAll=deltas.length?deltas.reduce(function(a,v){return a+v},0)/deltas.length:0;

  function setChange(id,diff,suffix){
    var el=document.getElementById(id);
    el.textContent=fmt(diff)+(suffix||' vs yesterday');
    el.className='stat-change '+(diff>0?'up':diff<0?'down':'');
  }

  document.getElementById('totalCites').textContent=total.toLocaleString();
  document.getElementById('todayCites').textContent=fmt(todayNew);
  document.getElementById('paperCount').textContent=papersData.length;
  document.getElementById('avgGrowth').textContent=avg7.toFixed(1);
  document.getElementById('avgAll').textContent='all-time avg: '+avgAll.toFixed(1)+'/day';
  document.getElementById('daysTracked').textContent=newCount>0?('✨ '+newCount+' new this window'):(allDates.length+' days tracked');
  setChange('totalChange',todayNew);
  setChange('todayChange',todayNew-yestNew,' vs yesterday');

  /* last updated */
  document.getElementById('lastUpdated').innerHTML=
    '<span class="pulse"></span>Last updated: '+(maxDate||'—')+' · tracking '+papersData.length+' papers over '+allDates.length+' days';

  /* ── overall trend chart ── */
  var col=chartColors();
  var octx=document.getElementById('overallChart').getContext('2d');
  var ograd=octx.createLinearGradient(0,0,0,230);
  ograd.addColorStop(0,'rgba(99,102,241,.28)');
  ograd.addColorStop(1,'rgba(99,102,241,0)');
  new Chart(octx,{
    type:'line',
    data:{
      labels:allDates.map(function(d){return d.slice(5)}),
      datasets:[{
        data:dailyTotals,
        borderColor:'#6366f1',backgroundColor:ograd,
        fill:true,tension:.35,borderWidth:2.5,
        pointRadius:allDates.length>60?0:2.5,pointHoverRadius:6,
        pointBackgroundColor:'#6366f1',pointBorderColor:'#fff',pointBorderWidth:1.5
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:trendTooltip(allDates)},
      scales:{
        x:{grid:{display:false},ticks:{color:col.tick,maxTicksLimit:13}},
        y:{grid:{color:col.grid},ticks:{color:col.tick}}
      }
    }
  });

  /* ── recent milestones (papers crossing round citation thresholds) ── */
  renderMilestones();

  renderList();

}).catch(function(e){
  document.getElementById('list').innerHTML='<div class="error-msg">❌ '+esc(e.message)+'</div>';
});
</script>
</body>
</html>
